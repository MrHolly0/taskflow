server:
  port: ${NOTIFICATION_PORT:8082}

spring:
  application:
    name: taskflow-notification-worker
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
      connection-timeout: 5000
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 15000
          writetimeout: 15000
          starttls:
            enable: true

app:
  public-base-url: ${PUBLIC_BASE_URL:}
  branding:
    name: ${APP_NAME:Мунин}
  mail:
    from: ${SMTP_FROM:}
  frontend:
    miniapp-url: ${PUBLIC_BASE_URL:}
  telegram:
    widgets-enabled: ${TELEGRAM_WIDGETS_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: https://api.telegram.org
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:}
  notification:
    poll-interval-ms: ${NOTIFICATION_POLL_INTERVAL_MS:5000}
    batch-size: ${NOTIFICATION_BATCH_SIZE:50}
    concurrency: ${NOTIFICATION_CONCURRENCY:4}
    max-retries: ${NOTIFICATION_MAX_ATTEMPTS:5}
    lease-seconds: ${NOTIFICATION_LEASE_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
