databaseChangeLog:
  - changeSet:
      id: 043-task-read-indexes
      author: taskflow
      changes:
        - sql:
            sql: CREATE INDEX idx_tasks_live_user_created ON tasks (user_id, created_at DESC, id) WHERE is_deleted = false
        - sql:
            sql: CREATE INDEX idx_tasks_live_user_status_created ON tasks (user_id, status, created_at DESC, id) WHERE is_deleted = false
        - sql:
            sql: CREATE INDEX idx_tasks_live_user_completed ON tasks (user_id, completed_at DESC) WHERE is_deleted = false AND status = 'DONE'
