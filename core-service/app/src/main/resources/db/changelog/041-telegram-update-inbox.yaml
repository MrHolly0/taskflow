databaseChangeLog:
  - changeSet:
      id: 041-telegram-update-inbox
      author: taskflow
      changes:
        - sql:
            sql: |
              CREATE TABLE telegram_update_inbox (
                update_id BIGINT PRIMARY KEY,
                sender_id BIGINT NOT NULL,
                payload JSONB NOT NULL,
                checkpoints JSONB NOT NULL DEFAULT '{}'::jsonb,
                status VARCHAR(16) NOT NULL DEFAULT 'PENDING',
                received_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                next_attempt_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                attempts INTEGER NOT NULL DEFAULT 0,
                lease_token UUID,
                lease_until TIMESTAMPTZ,
                processed_at TIMESTAMPTZ,
                last_error VARCHAR(128),
                CONSTRAINT telegram_update_status CHECK (status IN ('PENDING', 'PROCESSING', 'DONE', 'FAILED'))
              );
              CREATE INDEX telegram_update_ready_idx ON telegram_update_inbox (next_attempt_at, update_id)
                WHERE status IN ('PENDING', 'PROCESSING');
              CREATE INDEX telegram_update_sender_idx ON telegram_update_inbox (sender_id, update_id)
                WHERE status IN ('PENDING', 'PROCESSING');
              CREATE INDEX telegram_update_metrics_idx ON telegram_update_inbox (status, received_at)
                WHERE status IN ('PENDING', 'PROCESSING', 'FAILED');
