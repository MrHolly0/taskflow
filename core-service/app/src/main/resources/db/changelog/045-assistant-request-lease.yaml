databaseChangeLog:
  - changeSet:
      id: 045-assistant-request-lease
      author: taskflow
      changes:
        - addColumn:
            tableName: assistant_request_results
            columns:
              - column:
                  name: owner_token
                  type: UUID
              - column:
                  name: lease_until
                  type: TIMESTAMP WITH TIME ZONE
        - sql:
            sql: >
              CREATE INDEX idx_assistant_requests_lease ON assistant_request_results (lease_until)
              WHERE response_json IS NULL AND lease_until IS NOT NULL
