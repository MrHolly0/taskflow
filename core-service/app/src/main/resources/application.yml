spring:
  application:
    name: taskflow-core
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      connect-timeout: 500ms
      timeout: 500ms
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: "SET statement_timeout = '15s'"
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 18MB
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 15000
          writetimeout: 15000
          starttls:
            enable: true

server:
  tomcat:
    threads:
      max: 32
      min-spare: 2
    max-connections: 256
    accept-count: 64
    connection-timeout: 5s
  port: ${SERVER_PORT:8080}
  # Доверять X-Forwarded-For только от nginx (соединение из приватной сети —
  # у настоящего интернет-клиента такого адреса быть не может), а не любому,
  # кто его пришлёт. native — RemoteIpValve Tomcat со стандартным
  # internal-proxies (loopback + приватные диапазоны, docker-сеть туда
  # попадает); framework (ForwardedHeaderFilter) такой проверки не делает —
  # переписывает адрес по заголовку от кого угодно.
  forward-headers-strategy: native

app:
  resources:
    internal-secret: ${NLP_INTERNAL_SECRET:}
    global-concurrent: ${MODEL_GLOBAL_CONCURRENT:4}
    user-concurrent: ${MODEL_USER_CONCURRENT:1}
    worker-concurrent: ${MODEL_WORKER_CONCURRENT:4}
    user-daily-tokens: ${MODEL_USER_DAILY_TOKENS:250000}
    global-daily-tokens: ${MODEL_GLOBAL_DAILY_TOKENS:5000000}
    user-daily-audio-seconds: ${MODEL_USER_DAILY_AUDIO_SECONDS:600}
    global-daily-audio-seconds: ${MODEL_GLOBAL_DAILY_AUDIO_SECONDS:7200}
  assistant:
    experimental-reasoning-effort: ${ASSISTANT_EXPERIMENTAL_REASONING_EFFORT:low}
    planning-mode: ${ASSISTANT_PLANNING_MODE:BATCH_PLAN}
    code-mode:
      node: ${CODE_MODE_NODE:node}
      runner: ${CODE_MODE_RUNNER:code-runtime/runner.mjs}
  branding:
    name: ${APP_NAME:Мунин}
  public-base-url: ${PUBLIC_BASE_URL:}
  jwt:
    secret: ${JWT_SECRET:dev_secret_key_must_be_at_least_32_characters_long}
    access-token-ttl-seconds: ${JWT_TTL_SECONDS:900}
  qa-login-secret: ${QA_LOGIN_SECRET:}
  geoip:
    database-path: ${GEOIP_DB_PATH:}
  mail:
    from: ${SMTP_FROM:}
  ucaller:
    service-id: ${UCALLER_SERVICE_ID:}
    secret-key: ${UCALLER_SECRET_KEY:}
    callback-secret: ${UCALLER_CALLBACK_SECRET:}
  telegram:
    widgets-enabled: ${TELEGRAM_WIDGETS_ENABLED:false}
    login-always-visible: ${TELEGRAM_LOGIN_ALWAYS_VISIBLE:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    auth-date-max-age: ${TELEGRAM_AUTH_MAX_AGE:86400}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    voice-dir: ${TELEGRAM_VOICE_DIR:/tmp/taskflow/voice}
    miniapp-url: ${PUBLIC_BASE_URL:}
  nlp:
    worker-url: ${NLP_WORKER_URL:http://localhost:8081}
  focus:
    hint:
      min-title-words: 4
      estimate-threshold-minutes: 30
    hours-gate:
      window-start-hour: 9
      window-end-hour: 19
      # §5.4: префикс слова ловит падежные формы без морфологии.
      # «банк» убран: падежные формы «банку» и «банке» совпадают у
      # учреждения и ёмкости. Пропуск здесь безопаснее ложного скрытия
      # задачи вне окна 9–19.
      # Вечерние учреждения (кино, спортзал и подобные) сюда намеренно не
      # включены: окно 9–19 для них неверно.
      roots:
        - поликлин
        - больниц
        - аптек
        - магаз
        - мфц
        - нотар
        - автосерв
        - химчист
        - загс
        - соцзащит
        - полиц
        - консульст
        - ветеринар

resilience4j:
  circuitbreaker:
    instances:
      nlp-worker:
        ignore-exceptions:
          - ru.taskflow.shared.resources.ResourceRejectedException
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      nlp-worker-tools:
        ignore-exceptions:
          - ru.taskflow.shared.resources.ResourceRejectedException
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  retry:
    instances:
      nlp-worker:
        max-attempts: 1
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      nlp-worker-tools:
        max-attempts: 1

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
