x-runtime: &runtime
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  pids_limit: 256

x-model-environment: &model-environment
  MODEL_GLOBAL_CONCURRENT: ${MODEL_GLOBAL_CONCURRENT:-4}
  MODEL_USER_CONCURRENT: ${MODEL_USER_CONCURRENT:-1}
  MODEL_WORKER_CONCURRENT: ${MODEL_WORKER_CONCURRENT:-4}
  MODEL_USER_DAILY_TOKENS: ${MODEL_USER_DAILY_TOKENS:-250000}
  MODEL_GLOBAL_DAILY_TOKENS: ${MODEL_GLOBAL_DAILY_TOKENS:-5000000}
  MODEL_USER_DAILY_AUDIO_SECONDS: ${MODEL_USER_DAILY_AUDIO_SECONDS:-600}
  MODEL_GLOBAL_DAILY_AUDIO_SECONDS: ${MODEL_GLOBAL_DAILY_AUDIO_SECONDS:-7200}

services:
  postgres:
    <<: *runtime
    mem_limit: 384m
    cpus: "1.0"
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskflow} -d ${DB_NAME:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *runtime
    mem_limit: 192m
    cpus: "0.5"
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-taskflow} --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-taskflow}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    profiles: [tools]
    <<: *runtime
    mem_limit: 256m
    cpus: "0.5"
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  nlp-worker:
    <<: *runtime
    mem_limit: 512m
    cpus: "1.5"
    build:
      context: ..
      dockerfile: nlp-worker/Dockerfile
    ports:
      - "127.0.0.1:${NLP_PORT:-8081}:8081"
    environment:
      <<: *model-environment
      GROQ_API_KEY: ${GROQ_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-taskflow}
      NLP_INTERNAL_SECRET: ${NLP_INTERNAL_SECRET:?NLP_INTERNAL_SECRET is required}
      NLP_PORT: 8081
    depends_on:
      redis:
        condition: service_healthy

  notification-worker:
    <<: *runtime
    mem_limit: 512m
    cpus: "1.0"
    build:
      context: ..
      dockerfile: notification-worker/Dockerfile
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8082}:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NOTIFICATION_PORT: 8082
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_NAME: ${APP_NAME:-Мунин}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      core-service:
        condition: service_healthy

  core-service:
    <<: *runtime
    mem_limit: 768m
    cpus: "2.0"
    build:
      context: ..
      dockerfile: core-service/Dockerfile
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    environment:
      <<: *model-environment
      ASSISTANT_EXPERIMENTAL_REASONING_EFFORT: ${ASSISTANT_EXPERIMENTAL_REASONING_EFFORT:-low}
      ASSISTANT_PLANNING_MODE: ${ASSISTANT_PLANNING_MODE:-BATCH_PLAN}
      CODE_MODE_RUNNER: /app/code-runtime/runner.mjs
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-taskflow}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-taskflow}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-taskflow}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-taskflow}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      GROQ_API_KEY: ${GROQ_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      QA_LOGIN_SECRET: ${QA_LOGIN_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NLP_INTERNAL_SECRET: ${NLP_INTERNAL_SECRET:?NLP_INTERNAL_SECRET is required}
      NLP_WORKER_URL: http://nlp-worker:8081
      SERVER_PORT: 8080
      GEOIP_DB_PATH: /data/geoip/dbip-country-lite.mmdb
      APP_NAME: ${APP_NAME:-Мунин}
      UCALLER_SERVICE_ID: ${UCALLER_SERVICE_ID:-}
      UCALLER_SECRET_KEY: ${UCALLER_SECRET_KEY:-}
      UCALLER_CALLBACK_SECRET: ${UCALLER_CALLBACK_SECRET:-}
    volumes:
      # Каталог, не файл: файл внутри появляется сам при первом старте
      # (docker-entrypoint.sh), а не ждёт ручной подготовки на хосте. Раньше
      # монтирование на несуществующий файл давало на хосте пустой каталог
      # вместо ошибки — тем же путём, что и файл, чтобы скачанное пережило
      # пересоздание контейнера.
      - ${GEOIP_DB_HOST_PATH:-./geoip}:/data/geoip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  miniapp:
    profiles: [preview]
    <<: *runtime
    mem_limit: 64m
    cpus: "0.5"
    build:
      context: ../miniapp
      dockerfile: Dockerfile
      args:
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "${MINIAPP_PORT:-3000}:3000"
    depends_on:
      - core-service

  nginx:
    <<: *runtime
    mem_limit: 64m
    cpus: "0.5"
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_TELEGRAM_BOT_ID: ${VITE_TELEGRAM_BOT_ID:-8738130486}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      core-service:
        condition: service_healthy
      nlp-worker:
        condition: service_healthy
      notification-worker:
        condition: service_healthy

  db-backup:
    <<: *runtime
    image: postgres:16-alpine
    mem_limit: 96m
    cpus: "0.25"
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-taskflow}
      PGUSER: ${DB_USER:-taskflow}
      PGPASSWORD: ${DB_PASSWORD:-taskflow}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backups:/backups
      - ./backup-loop.sh:/usr/local/bin/backup-loop:ro
    entrypoint: ["sh", "/usr/local/bin/backup-loop"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name '*.dump' -mmin -1560 -print -quit)\""]
      interval: 1h
      timeout: 5s
      retries: 2
      start_period: 2m

  prometheus:
    <<: *runtime
    profiles: [monitoring]
    image: prom/prometheus:v3.13.3
    mem_limit: 192m
    cpus: "0.5"
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=256MB"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  redis_data:
  backups:
  prometheus_data:
  postgres_data:
  nginx_cache:
