x-runtime: &runtime
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  pids_limit: 256

services:
  postgres:
    <<: *runtime
    mem_limit: 384m
    cpus: "1.0"
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    <<: *runtime
    mem_limit: 192m
    cpus: "0.5"
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  core-service:
    <<: *runtime
    mem_limit: 768m
    cpus: "2.0"
    build:
      context: ..
      dockerfile: core-service/Dockerfile
    environment:
      ASSISTANT_EXPERIMENTAL_REASONING_EFFORT: ${ASSISTANT_EXPERIMENTAL_REASONING_EFFORT:-low}
      ASSISTANT_PLANNING_MODE: ${ASSISTANT_PLANNING_MODE:-DIRECT}
      CODE_MODE_RUNNER: /app/code-runtime/runner.mjs
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME is required}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?DB_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      NLP_WORKER_URL: http://nlp-worker:8081
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2
      SERVER_PORT: 8080
      GEOIP_DB_PATH: /data/geoip/dbip-country-lite.mmdb
      APP_NAME: ${APP_NAME:-Мунин}
      UCALLER_SERVICE_ID: ${UCALLER_SERVICE_ID:-}
      UCALLER_SECRET_KEY: ${UCALLER_SECRET_KEY:-}
      UCALLER_CALLBACK_SECRET: ${UCALLER_CALLBACK_SECRET:-}
    volumes:
      # Каталог, не файл — см. комментарий в docker-compose.yml.
      - ${GEOIP_DB_HOST_PATH:-./geoip}:/data/geoip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nlp-worker:
    <<: *runtime
    mem_limit: 512m
    cpus: "1.5"
    build:
      context: ..
      dockerfile: nlp-worker/Dockerfile
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:ActiveProcessorCount=2
      NLP_PORT: 8081
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  notification-worker:
    <<: *runtime
    mem_limit: 512m
    cpus: "1.0"
    build:
      context: ..
      dockerfile: notification-worker/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:ActiveProcessorCount=2
      NOTIFICATION_PORT: 8082
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      APP_NAME: ${APP_NAME:-Мунин}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      postgres:
        condition: service_healthy
      core-service:
        condition: service_healthy
    restart: unless-stopped

  miniapp:
    profiles: [preview]
    <<: *runtime
    mem_limit: 64m
    cpus: "0.5"
    build:
      context: ../miniapp
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${APP_DOMAIN}/api/v1
        VITE_TELEGRAM_BOT_ID: ${VITE_TELEGRAM_BOT_ID:-8738130486}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
    restart: unless-stopped

  nginx:
    <<: *runtime
    mem_limit: 64m
    cpus: "0.5"
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_TELEGRAM_BOT_ID: ${VITE_TELEGRAM_BOT_ID:-8738130486}
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      core-service:
        condition: service_healthy
      nlp-worker:
        condition: service_healthy
      notification-worker:
        condition: service_healthy
    restart: unless-stopped

  db-backup:
    <<: *runtime
    image: postgres:16-alpine
    mem_limit: 96m
    cpus: "0.25"
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-taskflow}
      PGUSER: ${DB_USER:-taskflow}
      PGPASSWORD: ${DB_PASSWORD:-taskflow}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backups:/backups
      - ./backup-loop.sh:/usr/local/bin/backup-loop:ro
    entrypoint: ["sh", "/usr/local/bin/backup-loop"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name '*.dump' -mmin -1560 -print -quit)\""]
      interval: 1h
      timeout: 5s
      retries: 2
      start_period: 2m

  prometheus:
    <<: *runtime
    profiles: [monitoring]
    image: prom/prometheus:v3.13.3
    mem_limit: 192m
    cpus: "0.5"
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=256MB"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  backups:
  prometheus_data:
  postgres_data:
  redis_data:
  nginx_cache:
