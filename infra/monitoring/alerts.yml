groups:
  - name: munin
    rules:
      - alert: MuninServiceDown
        expr: up{job="munin"} == 0
        for: 2m
        annotations:
          summary: "Сервис Мунина недоступен"
      - alert: MuninNotificationDeliveryFailed
        expr: taskflow_notifications_failed > 0
        for: 2m
        annotations:
          summary: "Есть окончательно не доставленные уведомления"
      - alert: MuninNotificationBacklog
        expr: taskflow_notifications_oldest_due_seconds > 120
        for: 2m
        annotations:
          summary: "Очередь уведомлений отстаёт более чем на две минуты"
      - alert: MuninServerErrors
        expr: sum(rate(http_server_requests_seconds_count{job="munin",status=~"5.."}[5m])) > 0.2
        for: 5m
        annotations:
          summary: "Участились ошибки сервера"
      - alert: MuninDatabasePoolBusy
        expr: hikaricp_connections_pending > 0
        for: 2m
        annotations:
          summary: "Запросы ожидают соединения с базой"
      - alert: MuninTelegramProcessingFailed
        expr: telegram_inbox_failed > 0
        for: 2m
        annotations:
          summary: "Есть не обработанные сообщения Telegram"
      - alert: MuninTelegramBacklog
        expr: telegram_inbox_oldest_age_seconds > 120
        for: 2m
        annotations:
          summary: "Обработка сообщений Telegram отстаёт"
      - alert: MuninModelResourceStorageFailure
        expr: sum(rate(model_resource_rejected_total{reason="storage"}[5m])) > 0
        for: 1m
        annotations:
          summary: "Хранилище ограничений модели недоступно"
      - alert: MuninModelUsageUnknown
        expr: sum(increase(model_resource_unknown_usage_total[15m])) > 3
        annotations:
          summary: "Есть обращения без подтверждённого расхода; полный резерв удержан"
      - alert: MuninModelReservationOverrun
        expr: sum(increase(model_resource_reservation_overrun_total[15m])) > 0
        annotations:
          summary: "Фактический расход превысил резерв"
      - alert: MuninAssistantExpiredClaims
        expr: assistant_request_expired_claims > 0
        for: 3m
        annotations:
          summary: "Остались незавершённые обращения с истёкшим сроком владения"
