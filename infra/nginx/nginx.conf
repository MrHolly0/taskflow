user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Без явно настроенного доверенного proxy клиентские X-Forwarded-For не принимаются.
    include /etc/nginx/trusted-proxies.conf;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_read:10m rate=20r/s;
    limit_req_status 429;
    map $request_method $write_key {
        default $binary_remote_addr;
        GET "";
        HEAD "";
        OPTIONS "";
    }
    limit_req_zone $write_key zone=api_mutation:10m rate=5r/s;

    # Upstream services
    upstream core_service {
        server core-service:8080;
    }

    upstream nlp_worker {
        server nlp-worker:8081;
    }

    upstream notification_worker {
        server notification-worker:8082;
    }


    # HTTP server (development mode)
    server {
        listen 80;
        server_name _;

        # API — core-service
        location = /api { return 404; }
        location /api/ {
            limit_req zone=api_read burst=40 nodelay;
            limit_req zone=api_mutation burst=20 nodelay;
            proxy_pass http://core_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 180s;
        }

        # Telegram webhook
        location /telegram/webhook {
            proxy_pass http://core_service/api/telegram/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Swagger UI
        location /swagger-ui.html {
            proxy_pass http://core_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location = /healthz { access_log off; return 200 "ok"; }
        location /actuator { return 404; }
        root /usr/share/nginx/html;
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
